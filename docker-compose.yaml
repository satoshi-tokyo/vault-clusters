      - "8211:8211"
    # Performance standby doesn't usually expose its API port externally
    environment:
      VAULT_ADDR: "http://cluster-perf-nd-1:8210"
      VAULT_CLUSTER_ADDR: "http://cluster-perf-nd-1:8211"
      VAULT_API_ADDR: "http://cluster-perf-nd-1:8210"
      VAULT_RAFT_NODE_ID: "cluster-perf-nd-1"
      VAULT_LICENSE: "${VAULT_LICENSE}"
    volumes:
