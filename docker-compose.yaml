      VAULT_CLUSTER_ADDR: "http://cluster-pri-nd-3:8205"
      VAULT_API_ADDR: "http://cluster-pri-nd-3:8204"
      VAULT_RAFT_NODE_ID: "cluster-pri-nd-3"
