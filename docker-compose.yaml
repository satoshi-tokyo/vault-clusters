  # 4. Nettool Utility Container
  nettool:
    image: nicolaka/netshoot:latest
    container_name: nettool
    hostname: nettool
    networks:
      - vault-net
    command: sleep infinity
    stdin_open: true
    tty: true
    restart: unless-stopped
# --- Network Definition ---